name: CI

on:
  - push
  - pull_request

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.txt

      - name: Check Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build image
        run: docker build -t service-watch:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag service-watch:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/service-watch:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/service-watch:${{ github.sha }}
